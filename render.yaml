databases:
  - name: paris-sender-db
    databaseName: paris_sender_db
    user: paris_sender_user

services:
  - type: redis
    name: paris-sender-redis
    ipAllowList: []

  - type: web
    name: paris-sender-web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      flask db upgrade || flask db init && flask db migrate -m "Initial" && flask db upgrade
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase: 
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_DEBUG
        value: "0"
