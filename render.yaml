databases:
  - name: paris-sender-db
    databaseName: paris_sender_db
    user: paris_sender_user

services:
  - type: redis
    name: paris-sender-redis
    ipAllowList: []

  - type: web
    name: paris-sender-web
    env: python
    pythonVersion: 3.11.4
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:10000 --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi:app
      - key: RENDER
        value: "true"
      - key: SMTP_PROXY_HOST
        sync: false
      - key: SMTP_PROXY_PORT
        sync: false
      - key: SMTP_PROXY_USER
        sync: false
      - key: SMTP_PROXY_PASS
        sync: false

  - type: worker
    name: paris-sender-worker
    env: python
    pythonVersion: 3.11.4
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery worker --loglevel=info --pool=threads --concurrency=4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: paris-sender-web
          envVarKey: SECRET_KEY
      - key: RENDER
        value: "true"
      - key: SMTP_PROXY_HOST
        sync: false
      - key: SMTP_PROXY_PORT
        sync: false
      - key: SMTP_PROXY_USER
        sync: false
      - key: SMTP_PROXY_PASS
        sync: false
