databases:
  - name: paris-sender-db
    databaseName: paris_sender_db
    user: paris_sender_user

services:
  - type: redis
    name: paris-sender-redis
    ipAllowList: []

  - type: web
    name: paris-sender-web
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi:app
      - key: FLASK_DEBUG
        value: "0"
      - key: SMTP_PROXY_HOST
        sync: false
      - key: SMTP_PROXY_PORT
        sync: false
      - key: SMTP_PROXY_USER
        sync: false
      - key: SMTP_PROXY_PASS
        sync: false

  - type: worker
    name: paris-sender-worker
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A wsgi.celery worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: paris-sender-web
          envVarKey: SECRET_KEY
      - key: SMTP_PROXY_HOST
        sync: false
      - key: SMTP_PROXY_PORT
        sync: false
      - key: SMTP_PROXY_USER
        sync: false
      - key: SMTP_PROXY_PASS
        sync: false
