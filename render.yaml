databases:
  - name: paris-sender-db
    databaseName: paris_sender_db
    user: paris_sender_user
    plan: free

services:
  - type: redis
    name: paris-sender-redis
    ipAllowList: [] # Keep empty to allow access from other Render services
    plan: free

  - type: web
    name: paris-sender-web
    env: python
    # pythonVersion is not needed for python environments on Render
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c gunicorn.conf.py wsgi:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi:app
      - key: RENDER
        value: "true"
      # These SMTP proxy vars are fine as sync: false, user provides them in UI
      - key: SMTP_PROXY_HOST
        sync: false
      - key: SMTP_PROXY_PORT
        sync: false
      - key: SMTP_PROXY_USER
        sync: false
      - key: SMTP_PROXY_PASS
        sync: false

  - type: worker
    name: paris-sender-worker
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    # CORRECTED startCommand:
    # - Points to the unified Celery app instance in `celery_app.py`.
    # - Uses 'eventlet' pool for consistency with gunicorn and better I/O performance.
    # - Reduced concurrency to 4 as a safe default for a free plan.
    startCommand: "celery -A celery_app:celery worker --loglevel=info --pool=eventlet --concurrency=4"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      # The worker needs its own reference to the secret key
      - key: SECRET_KEY
        fromService:
          type: web
          name: paris-sender-web
          envVarKey: SECRET_KEY
      - key: FLASK_APP
        value: wsgi:app
      - key: RENDER
        value: "true"
      - key: SMTP_PROXY_HOST
        sync: false
      - key: SMTP_PROXY_PORT
        sync: false
      - key: SMTP_PROXY_USER
        sync: false
      - key: SMTP_PROXY_PASS
        sync: false
