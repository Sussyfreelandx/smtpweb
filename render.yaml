# Blueprint for deploying the Paris Sender Web App on Render

# The 'databases' block is a top-level key, separate from 'services'.
databases:
  - name: paris-sender-db
    plan: free # Use a paid plan for production to prevent data loss.
    # A free database instance is paused after 90 days of inactivity.

services:
  # A Redis instance for our Celery broker and result backend
  - type: redis
    name: paris-sender-redis
    ipAllowList: [] # Allow all, or secure by specifying IPs
    plan: free # Use a paid plan for production
    maxmemoryPolicy: allkeys-lru # Recommended for Celery

  # The main web server (Flask/Gunicorn)
  - type: web
    name: paris-sender-web
    env: python
    plan: free # Use a paid plan for production
    buildCommand: |
      pip install -r requirements.txt
      flask db upgrade
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgres # CORRECTED: The type is 'postgres'
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Let Render generate a random secret key
      - key: FLASK_APP
        value: wsgi.py

  # The background worker for sending emails
  - type: worker
    name: paris-sender-worker
    env: python
    plan: free # Use a paid plan for production
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A wsgi.celery worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgres # CORRECTED: The type is 'postgres'
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
