# This configuration tells Render how to build and run your services.
# It defines a PostgreSQL database, a Redis instance for background jobs,
# a web server to handle user requests, and a worker to send emails.

databases:
  # A PostgreSQL database for storing users, campaigns, etc.
  - name: paris-sender-db
    databaseName: paris_sender_db
    user: paris_sender_user
    plan: free # Use a paid plan for production apps

services:
  # A Redis instance for our Celery message broker
  - type: redis
    name: paris-sender-redis
    plan: free # Use a paid plan for production
    ipAllowList: [] # Allows connections from anywhere, secure this in production

  # The main Flask web server
  - type: web
    name: paris-sender-web
    env: python
    plan: free # Use a paid plan for production
    buildCommand: |
      pip install -r requirements.txt
      flask db upgrade
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgres # CORRECTED: 'postgres' is the valid type for Render's PostgreSQL
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Let Render generate a random secret key
      - key: FLASK_APP
        value: wsgi:app # Best practice to be explicit
      - key: FLASK_DEBUG
        value: "0" # Disable debug mode in production

  # The Celery background worker for sending emails
  - type: worker
    name: paris-sender-worker
    env: python
    plan: free # Use a paid plan for production
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A wsgi.celery worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromService:
          type: postgres # CORRECTED: 'postgres' is the valid type for Render's PostgreSQL
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: paris-sender-web
          envVarKey: SECRET_KEY # Ensures worker and web use the same secret key
