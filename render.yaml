# render.yaml
# This configuration tells Render how to build and run the services.

databases:
  # A PostgreSQL database for storing users, campaigns, etc.
  - name: paris-sender-db
    databaseName: paris_sender_db
    user: paris_sender_user
    plan: free # Use a paid plan for production apps

services:
  # A Redis instance for our Celery message broker
  - type: redis
    name: paris-sender-redis
    plan: free # Use a paid plan for production
    ipAllowList: [] # Allows connections from anywhere, secure this in production

  # The main Flask web server
  - type: web
    name: paris-sender-web
    env: python
    plan: free # Use a paid plan for production
    buildCommand: |
      pip install -r requirements.txt
      flask db upgrade
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: DATABASE_URL
        fromService:
          type: psql
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Let Render generate a random secret key
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_DEBUG
        value: "0"

  # The Celery background worker for sending emails
  - type: worker
    name: paris-sender-worker
    env: python
    plan: free # Use a paid plan for production
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromService:
          type: psql
          name: paris-sender-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paris-sender-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
