{% extends "base.html" %}

{% block content %}
<style>
    /* Match Screenshot Buttons */
    .btn-purple { background-color: #8e44ad; color: white; }
    .btn-purple:hover { background-color: #732d91; color: white; }
    .btn-teal { background-color: #1abc9c; color: white; }
    .btn-teal:hover { background-color: #16a085; color: white; }
    .btn-orange { background-color: #e67e22; color: white; }
    .btn-orange:hover { background-color: #d35400; color: white; }
    .btn-red { background-color: #e74c3c; color: white; }
    .btn-red:hover { background-color: #c0392b; color: white; }
    
    .toolbar-btn { margin-right: 5px; font-weight: bold; font-size: 0.9rem; }
</style>

<div class="mb-3">
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
</div>

<h1 class="mb-4">Create New Campaign</h1>
<form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
    <div class="row">
        <!-- Left Column: Content -->
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-header fw-bold"><i class="fas fa-edit me-2"></i> Message Content (Jinja2 Enabled)</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="campaign_name" class="form-label">Campaign Name</label>
                        <input type="text" class="form-control" id="campaign_name" name="campaign_name" required>
                    </div>

                    <!-- Toolbar from Screenshot -->
                    <div class="mb-2 d-flex flex-wrap">
                        <button type="button" class="btn btn-purple toolbar-btn" onclick="document.getElementById('html_upload').click()"><i class="fas fa-folder-open me-1"></i> Load HTML</button>
                        <input type="file" id="html_upload" accept=".html,.htm" style="display: none;" onchange="loadHtmlFile(this)">
                        
                        <button type="button" class="btn btn-teal toolbar-btn" onclick="loadTemplate()"><i class="fas fa-file-alt me-1"></i> Template</button>
                        <button type="button" class="btn btn-orange toolbar-btn" onclick="alert('Feature coming soon: Attachments via Web')"><i class="fas fa-paperclip me-1"></i> Attach</button>
                        <button type="button" class="btn btn-red toolbar-btn" onclick="document.getElementById('body_html').value=''"><i class="fas fa-trash me-1"></i> Clear</button>
                        <button type="button" class="btn btn-purple toolbar-btn" onclick="runAI('rewrite')"><i class="fas fa-magic me-1"></i> AI Rewrite</button>
                        <button type="button" class="btn btn-purple toolbar-btn" onclick="runAI('subject')"><i class="fas fa-heading me-1"></i> AI Subject</button>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject Line</label>
                        <input type="text" class="form-control" id="subject" name="subject" required placeholder="Hello {{firstname}}, check this out!">
                    </div>
                    
                    <div class="mb-3">
                        <label for="body_html" class="form-label">HTML Body</label>
                        <textarea class="form-control font-monospace" id="body_html" name="body_html" rows="12" required></textarea>
                    </div>

                    <!-- A/B Testing Toggle -->
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="ab_testing_toggle" name="ab_testing_enabled">
                        <label class="form-check-label fw-bold" for="ab_testing_toggle">Enable A/B Testing (Split 50/50)</label>
                    </div>

                    <div id="version_b_container" class="border p-3 rounded mb-3 bg-light" style="display:none;">
                        <h6 class="text-danger">Version B</h6>
                        <div class="mb-3">
                            <label for="subject_b" class="form-label">Subject Line B</label>
                            <input type="text" class="form-control" id="subject_b" name="subject_b">
                        </div>
                        <div class="mb-3">
                            <label for="body_b" class="form-label">HTML Body B</label>
                            <textarea class="form-control" id="body_b" name="body_b" rows="8"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Secure Redirector -->
            <div class="card mb-4">
                 <div class="card-header fw-bold">Secure Redirector (Optional)</div>
                 <div class="card-body">
                     <div class="row">
                         <div class="col-md-6 mb-3">
                             <label class="form-label">Burner Domain</label>
                             <input type="text" class="form-control" name="burner_domain" placeholder="e.g. secure-docs-update.com">
                         </div>
                         <div class="col-md-6 mb-3">
                             <label class="form-label">Lure Path</label>
                             <input type="text" class="form-control" name="lure_path" placeholder="e.g. auth/login">
                         </div>
                     </div>
                 </div>
            </div>
        </div>

        <!-- Right Column: Settings -->
        <div class="col-lg-4">
            <!-- Recipients -->
            <div class="card mb-4">
                <div class="card-header fw-bold bg-warning text-dark"><i class="fas fa-users me-2"></i> Recipients</div>
                <div class="card-body">
                    <!-- Button group matching screenshot (visually simplified for form) -->
                    <div class="mb-2">
                         <button type="button" class="btn btn-success btn-sm w-100 mb-1" onclick="document.getElementById('recipients_file').click()">
                            <i class="fas fa-folder-open"></i> Load CSV List
                         </button>
                         <input class="form-control" type="file" id="recipients_file" name="recipients_file" accept=".csv" style="display:none;" onchange="updateFileName(this)">
                         <div id="file-name-display" class="text-muted small text-center">No file selected</div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                         <button type="button" class="btn btn-primary btn-sm" onclick="alert('Use Ctrl+V in the file input or load CSV')"><i class="fas fa-paste"></i> Paste</button>
                         <button type="button" class="btn btn-warning btn-sm text-dark" onclick="validateListSim()"><i class="fas fa-check"></i> Validate</button>
                         <button type="button" class="btn btn-danger btn-sm" onclick="clearFile()"><i class="fas fa-trash"></i> Clear</button>
                    </div>
                </div>
            </div>

            <!-- SMTP Config -->
            <div class="card mb-4">
                <div class="card-header fw-bold"><i class="fas fa-server me-2"></i> SMTP Configuration</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Profile</label>
                        <select class="form-select" name="smtp_profile_id">
                            {% for profile in smtp_profiles %}
                                <option value="{{ profile.id }}">{{ profile.profile_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <!-- Parallel Workers Input -->
                    <div class="row mb-2 align-items-center">
                        <label class="col-sm-6 col-form-label">Parallel Workers:</label>
                        <div class="col-sm-6">
                            <input type="number" class="form-control" name="parallel_workers" value="10" min="1" max="50">
                        </div>
                    </div>
                    
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="smtp_rotation" name="smtp_rotation_enabled">
                        <label class="form-check-label" for="smtp_rotation">Enable SMTP Rotation</label>
                    </div>
                </div>
            </div>
            
            <!-- Controls & Scheduling (Throttling) -->
            <div class="card mb-4">
                <div class="card-header fw-bold"><i class="fas fa-clock me-2"></i> Throttling</div>
                <div class="card-body">
                    <div class="row g-2 align-items-center">
                        <div class="col-auto">Send</div>
                        <div class="col">
                            <input type="number" class="form-control" name="throttle_amount" value="20">
                        </div>
                        <div class="col-auto">emails every</div>
                    </div>
                    <div class="row g-2 align-items-center mt-2">
                        <div class="col">
                            <input type="number" class="form-control" name="throttle_delay" value="1">
                        </div>
                        <div class="col">
                            <select class="form-select" name="throttle_unit">
                                <option value="Minutes">Minutes</option>
                                <option value="Seconds">Seconds</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg fw-bold"><i class="fas fa-play me-2"></i> START CAMPAIGN</button>
            </div>
        </div>
    </div>
</form>

<script>
    // A/B Toggle
    document.getElementById('ab_testing_toggle').addEventListener('change', function() {
        document.getElementById('version_b_container').style.display = this.checked ? 'block' : 'none';
    });

    // File Name Update
    function updateFileName(input) {
        if (input.files && input.files.length > 0) {
            document.getElementById('file-name-display').innerText = input.files[0].name;
        }
    }
    
    function clearFile() {
        document.getElementById('recipients_file').value = '';
        document.getElementById('file-name-display').innerText = 'No file selected';
    }

    // Load HTML File content into Textarea
    function loadHtmlFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('body_html').value = e.target.result;
            };
            reader.readAsText(input.files[0]);
        }
    }
    
    // Load Template (Simple Example)
    function loadTemplate() {
        const tpl = "<p>Hi {{firstname}},</p>\n<p>This is a message from {{company}}.</p>";
        document.getElementById('body_html').value = tpl;
    }

    // Simulation of Validate
    function validateListSim() {
        alert("Validating list structure (Simulated)... OK.");
    }

    // AI Calls
    function runAI(type) {
        const subject = document.getElementById('subject').value;
        const body = document.getElementById('body_html').value;
        const btn = event.target;
        const originalText = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        
        fetch("{{ url_for('main.deliverability_tools_ajax') }}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ subject: subject, body: body, provider: 'openai' })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success && type === 'rewrite') {
                if(confirm("Replace body with AI result?\n" + data.result.substring(0, 100) + "...")) {
                    document.getElementById('body_html').value = data.result;
                }
            } else if (data.success && type === 'subject') {
                alert("AI Suggestions:\n" + data.result);
            } else {
                alert("AI Error: " + data.result);
            }
        })
        .finally(() => { btn.innerHTML = originalText; });
    }
</script>
{% endblock %}
