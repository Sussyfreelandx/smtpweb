{% extends "base.html" %}

{% block content %}
    <h1>Create New Campaign</h1>
    <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="campaign_name" class="form-label">Campaign Name</label>
            <input type="text" class="form-control" id="campaign_name" name="campaign_name" required>
        </div>

        <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" name="subject" placeholder="Use {{firstname}} for personalization" required>
        </div>

        <div class="mb-3">
            <label for="body_html" class="form-label">HTML Body</label>
            <textarea class="form-control" id="body_html" name="body_html" rows="12" placeholder="Full HTML content. Use Jinja2 for personalization, e.g., {{firstname}}, {{company}}, {{greetings}}"></textarea>
        </div>

        <div class="mb-3">
            <label for="recipients_file" class="form-label">Recipients (CSV file)</label>
            <input class="form-control" type="file" id="recipients_file" name="recipients_file" accept=".csv" required>
            <div class="form-text">Your CSV must have an 'email' column header. Other columns can be used for personalization, e.g., 'firstname', 'company'.</div>
        </div>

        <hr>
        <h3>SMTP Configuration</h3>
        <p class="text-muted">These credentials will be stored with the campaign.</p>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="smtp_server" class="form-label">SMTP Server</label>
                <input type="text" class="form-control" id="smtp_server" name="smtp_server" required>
            </div>
            <div class="col-md-6">
                <label for="smtp_port" class="form-label">Port</label>
                <input type="number" class="form-control" id="smtp_port" name="smtp_port" value="587" required>
            </div>
            <div class="col-md-6">
                <label for="smtp_username" class="form-label">Username</label>
                <input type="email" class="form-control" id="smtp_username" name="smtp_username" required>
            </div>
            <div class="col-md-6">
                <label for="smtp_password" class="form-label">Password</label>
                <input type="password" class="form-control" id="smtp_password" name="smtp_password" required>
            </div>
             <div class="col-md-6">
                <label for="smtp_sender_name" class="form-label">Sender Name</label>
                <input type="text" class="form-control" id="smtp_sender_name" name="smtp_sender_name" required>
            </div>
            <div class="col-md-6">
                <label for="smtp_sender_email" class="form-label">Sender Email</label>
                <input type="email" class="form-control" id="smtp_sender_email" name="smtp_sender_email" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-4 btn-lg">Create Campaign</button>
    </form>
{% endblock %}
