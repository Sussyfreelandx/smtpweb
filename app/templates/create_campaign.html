{% extends "base.html" %}

{% block content %}
    <h1 class="mb-4">Create New Campaign</h1>
    <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
        <div class="card mb-4">
            <div class="card-header">1. Campaign Details</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="campaign_name" class="form-label">Campaign Name</label>
                    <input type="text" class="form-control" id="campaign_name" name="campaign_name" placeholder="e.g., Q4 Product Launch" required>
                </div>
                <div class="mb-3">
                    <label for="subject" class="form-label">Subject Line</label>
                    <input type="text" class="form-control" id="subject" name="subject" placeholder="An important message for you" required>
                </div>
                <div class="mb-3">
                    <label for="body_html" class="form-label">HTML Body</label>
                    <textarea class="form-control" id="body_html" name="body_html" rows="12" placeholder="Use {{ firstname }} for personalization. Full HTML is supported." required></textarea>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">2. Recipients</div>
            <div class="card-body">
                <label for="recipients_file" class="form-label">Upload Recipients CSV</label>
                <input class="form-control" type="file" id="recipients_file" name="recipients_file" accept=".csv" required>
                <div class="form-text">Your CSV must have an 'email' column header. Other columns like 'firstname' will be used for personalization.</div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">3. SMTP Configuration</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="smtp_server" class="form-label">SMTP Server</label>
                        <input type="text" class="form-control" id="smtp_server" name="smtp_server" placeholder="smtp.example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="smtp_port" class="form-label">Port</label>
                        <input type="number" class="form-control" id="smtp_port" name="smtp_port" value="587" required>
                    </div>
                    <div class="col-md-6">
                        <label for="smtp_sender_name" class="form-label">Sender Name</label>
                        <input type="text" class="form-control" id="smtp_sender_name" name="smtp_sender_name" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label for="smtp_sender_email" class="form-label">Sender Email</label>
                        <input type="email" class="form-control" id="smtp_sender_email" name="smtp_sender_email" placeholder="john.doe@example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="smtp_username" class="form-label">Username</label>
                        <input type="email" class="form-control" id="smtp_username" name="smtp_username" placeholder="Usually the same as sender email" required>
                    </div>
                    <div class="col-md-6">
                        <label for="smtp_password" class="form-label">Password / App Password</label>
                        <input type="password" class="form-control" id="smtp_password" name="smtp_password" required>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Create & Save Campaign</button>
    </form>
{% endblock %}
