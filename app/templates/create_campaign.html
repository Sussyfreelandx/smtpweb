{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4"><i class="fas fa-envelope-open-text me-2"></i>Create New Campaign</h1>
    
    <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate id="campaignForm">
        
        <div class="row">
            <!-- Left Column: Config -->
            <div class="col-lg-4 mb-4">
                
                <!-- 1. General Config -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">⚙️ Configuration</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Campaign Name</label>
                            <input type="text" class="form-control" name="campaign_name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">SMTP Profile</label>
                            <select class="form-select" name="smtp_profile_id" required>
                                {% for p in profiles %}
                                <option value="{{ p.id }}">{{ p.profile_name }} ({{ p.username }})</option>
                                {% else %}
                                <option disabled>No profiles found. Create one first.</option>
                                {% endfor %}
                            </select>
                            <div class="mt-2 text-end">
                                <a href="{{ url_for('main.smtp_profiles') }}" class="small">Manage Profiles</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Performance Settings (Parallel/Throttle) -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">🚀 Performance</div>
                    <div class="card-body">
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-8"><label class="form-label mb-0">Parallel Workers</label></div>
                            <div class="col-4"><input type="number" class="form-control form-control-sm" name="parallel_workers" value="1" min="1" max="10"></div>
                        </div>
                        <hr class="my-2">
                        <label class="form-label small text-muted">Throttling Rules</label>
                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text">Send</span>
                            <input type="number" class="form-control" name="throttle_amount" value="20">
                            <span class="input-group-text">emails</span>
                        </div>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text">Wait</span>
                            <input type="number" class="form-control" name="throttle_delay" value="60">
                            <span class="input-group-text">seconds</span>
                        </div>
                    </div>
                </div>

                <!-- 3. Recipients -->
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white fw-bold">👥 Recipients</div>
                    <div class="card-body">
                        <ul class="nav nav-tabs mb-3" id="recipientTabs" role="tablist">
                            <li class="nav-item"><button class="nav-link active" data-bs-target="#tab-file" data-bs-toggle="tab" type="button">Upload</button></li>
                            <li class="nav-item"><button class="nav-link" data-bs-target="#tab-paste" data-bs-toggle="tab" type="button">Paste</button></li>
                        </ul>
                        
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="tab-file">
                                <label class="form-label small">CSV File (Must have 'email' header)</label>
                                <input class="form-control form-control-sm" type="file" name="recipients_file" accept=".csv">
                            </div>
                            <div class="tab-pane fade" id="tab-paste">
                                <label class="form-label small">Paste Emails (One per line)</label>
                                <textarea class="form-control form-control-sm" name="pasted_emails" rows="5" placeholder="user@example.com"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Editor -->
            <div class="col-lg-8">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-white p-2">
                        <!-- Simulated Toolbar from screenshot -->
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="loadSampleTemplate()"><i class="fas fa-file-code me-1"></i> Template</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('body_html').value=''"><i class="fas fa-trash me-1"></i> Clear</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="insertPlaceholder('{{ firstname }}')">[Firstname]</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="insertPlaceholder('{{ company }}')">[Company]</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Subject Line</label>
                            <input type="text" class="form-control" name="subject" placeholder="Hello {{ firstname|default('there') }}!" required>
                            <div class="form-text small">Supports spintax: {Hi|Hello} and placeholders: {{ firstname }}</div>
                        </div>
                        
                        <div class="mb-3 h-100 d-flex flex-column">
                            <label class="form-label fw-bold">Message Body (HTML)</label>
                            <textarea class="form-control flex-grow-1 font-monospace" id="body_html" name="body_html" rows="15" required style="font-size: 0.9rem;"></textarea>
                        </div>
                    </div>
                    <div class="card-footer bg-light text-end">
                        <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Create Campaign</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
function loadSampleTemplate() {
    const template = `<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif;">
    <p>{{ greetings }},</p>
    
    <p>This is a message for {{ company }}.</p>
    
    <p>Regards,<br>{{ sender_name }}</p>
    
    <hr>
    <p><small><a href="{{ unsubscribe_link }}">Unsubscribe</a></small></p>
</body>
</html>`;
    document.getElementById('body_html').value = template;
}

function insertPlaceholder(text) {
    const textarea = document.getElementById('body_html');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + text + val.substring(end);
    textarea.focus();
}
</script>
{% endblock %}
