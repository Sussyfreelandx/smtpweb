{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="error-page">
                <h1 class="display-1 text-warning">429</h1>
                <i class="fas fa-hourglass-half fa-5x text-warning mb-4"></i>
                <h2 class="mb-3">Too Many Requests</h2>
                <p class="text-muted mb-4">
                    You've made too many requests in a short period. Please wait a moment and try again.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="javascript:location.reload()" class="btn btn-outline-secondary">
                        <i class="fas fa-redo me-2"></i> Try Again
                    </a>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i> Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
