{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-5">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle fa-4x text-danger"></i>
                </div>
                <h1 class="display-4 fw-bold mb-3">500</h1>
                <h2 class="h4 mb-4">Internal Server Error</h2>
                <p class="text-muted mb-4">
                    The server encountered an internal error and was unable to complete your request.
                    An administrator has been notified.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 gap-3">
                        <i class="fas fa-home me-2"></i>Return Home
                    </a>
                    <a href="javascript:location.reload();" class="btn btn-outline-secondary px-4">
                        <i class="fas fa-sync-alt me-2"></i>Try Again
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
